[package]
name = "nexora"
version = "0.1.0"
description = "Nexora — local-first AI coding studio"
authors = ["Nexora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
