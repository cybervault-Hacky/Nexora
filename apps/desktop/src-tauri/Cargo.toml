[package]
name = "nexora"
version = "0.1.0"
description = "Nexora — local-first AI coding studio"
authors = ["Nexora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
getrandom = "0.2"
sha2 = "0.10"
similar = "2.7"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
