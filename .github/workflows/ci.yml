# Continuous integration for Nexora.
#
# Scope: verification across Frontend, Desktop Rust Core, Auth/Billing/Quota
# PostgreSQL Backend, and Native Windows NSIS Packaging. Nothing here publishes,
# tags, signs with production keys, or creates a release automatically.
#
# Every action is pinned to a commit SHA.

name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, tests, production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit the locked JavaScript dependency graph
        run: pnpm audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  auth-backend:
    name: Auth, Plans, Billing & Quota Service (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_only
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        working-directory: services/nexora-auth
        run: cargo --locked fmt --all -- --check

      - name: Lint with warnings denied
        working-directory: services/nexora-auth
        run: cargo --locked clippy --all-targets -- -D warnings

      - name: Run unit, HTTP, property & PostgreSQL integration suites
        working-directory: services/nexora-auth
        env:
          NEXORA_AUTH_TEST_DATABASE_URL: postgres://postgres:postgres_ci_test_only@127.0.0.1:5432/nexora_test?sslmode=disable
        run: cargo --locked test -- --include-ignored --test-threads=1

  rust:
    name: Rust Desktop Core — fmt, check, clippy, tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo --locked fmt --all -- --check

      - name: Type-check every target
        working-directory: apps/desktop/src-tauri
        run: cargo --locked check --all-targets

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo --locked test 2>&1 | tee rust-test.log
          exit "${PIPESTATUS[0]}"

      - name: Report failing tests
        if: failure()
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ ! -f rust-test.log ]; then
            exit 0
          fi

          awk '/^failures:$/ { section = 1; next } /^test result:/ { section = 0 } section' rust-test.log | sed '/^[[:space:]]*$/d' > failing-tests.txt

          while IFS= read -r name; do
            echo "::error title=Rust test failed::${name}"
          done < failing-tests.txt

      - name: Lint with warnings denied
        working-directory: apps/desktop/src-tauri
        run: cargo --locked clippy --all-targets -- -D warnings

  windows:
    name: Windows — compile, Rust tests & NSIS installer verification
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Configure the hosted x64 MSVC and Windows SDK environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "The Windows runner image does not contain Visual Studio Installer's vswhere.exe."
          }

          $installationPath = [string](& $vswhere -latest -products '*' -requires 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' -property installationPath | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw "No Visual Studio 2022 installation with the x86/x64 C++ tools was found."
          }
          $installationPath = $installationPath.Trim()
          $developerCommand = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $developerCommand)) {
            throw "Visual Studio's x64 developer command script is missing."
          }

          $commandLine = 'call "' + $developerCommand + '" -no_logo -arch=x64 -host_arch=x64 && set'
          $environmentLines = & $env:ComSpec /d /s /c $commandLine
          if ($LASTEXITCODE -ne 0 -or -not $environmentLines) {
            throw "VsDevCmd.bat failed to initialize the x64 MSVC environment."
          }

          $windowsSdkPathEntries = @()
          foreach ($line in $environmentLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -ieq 'PATH') {
                $env:PATH = $value
                $windowsSdkPathEntries = @($value -split ';' | Where-Object {
                  $_ -and ($_ -like '*\Microsoft Visual Studio\*' -or $_ -like '*\Windows Kits\*')
                })
              } elseif ($name -notmatch '^(GITHUB_|RUNNER_)') {
                [Environment]::SetEnvironmentVariable($name, $value, 'Process')
                Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
              }
            }
          }

          foreach ($requiredTool in @('cl.exe', 'link.exe', 'rc.exe')) {
            if (-not (Get-Command $requiredTool -ErrorAction SilentlyContinue)) {
              throw "The initialized x64 developer environment does not expose $requiredTool."
            }
          }
          if ($windowsSdkPathEntries.Count -eq 0) {
            throw "VsDevCmd.bat did not expose Visual Studio or Windows SDK tools on PATH."
          }
          foreach ($pathEntry in $windowsSdkPathEntries) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $pathEntry -Encoding utf8
          }

      - name: Type-check every target on Windows
        working-directory: apps/desktop/src-tauri
        run: cargo --locked check --all-targets

      - name: Run Rust tests on Windows
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo --locked test 2>&1 | tee windows-test.log
          exit "${PIPESTATUS[0]}"

      - name: Report failing Windows tests
        if: failure()
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ ! -f windows-test.log ]; then
            exit 0
          fi

          awk '/^failures:$/ { section = 1; next } /^test result:/ { section = 0 } section' windows-test.log | sed '/^[[:space:]]*$/d' > failing-tests.txt

          while IFS= read -r name; do
            echo "::error title=Rust test failed on Windows::${name}"
          done < failing-tests.txt

      - name: Build Windows x64 per-user NSIS installer & SHA-256 manifest
        shell: pwsh
        run: ./scripts/windows/build-installer.ps1

      - name: Verify NSIS install, WebView2, shortcuts, reinstall and uninstall (headless GUI launch skipped)
        shell: pwsh
        run: ./scripts/windows/smoke-verify.ps1
