# Continuous integration for Nexora.
#
# Scope: verification across Frontend, Desktop Rust Core, Auth/Billing/Quota
# PostgreSQL Backend, and Native Windows NSIS Packaging. Nothing here publishes,
# tags, signs with production keys, or creates a release automatically.
#
# Every action is pinned to a commit SHA.

name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, tests, production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  auth-backend:
    name: Auth, Plans, Billing & Quota Service (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_only
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        working-directory: services/nexora-auth
        run: cargo fmt --all -- --check

      - name: Lint with warnings denied
        working-directory: services/nexora-auth
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, HTTP, property & PostgreSQL integration suites
        working-directory: services/nexora-auth
        env:
          NEXORA_AUTH_TEST_DATABASE_URL: postgres://postgres:postgres_ci_test_only@127.0.0.1:5432/nexora_test
        run: cargo test -- --include-ignored --test-threads=1

  rust:
    name: Rust Desktop Core — fmt, check, clippy, tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Type-check every target
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee rust-test.log
          exit "${PIPESTATUS[0]}"

      - name: Report failing tests
        if: failure()
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ ! -f rust-test.log ]; then
            exit 0
          fi

          awk '/^failures:$/ { section = 1; next } /^test result:/ { section = 0 } section' rust-test.log | sed '/^[[:space:]]*$/d' > failing-tests.txt

          while IFS= read -r name; do
            echo "::error title=Rust test failed::${name}"
          done < failing-tests.txt

      - name: Lint with warnings denied
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Windows — compile, Rust tests & NSIS installer verification
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Type-check every target on Windows
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: Run Rust tests on Windows
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee windows-test.log
          exit "${PIPESTATUS[0]}"

      - name: Report failing Windows tests
        if: failure()
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ ! -f windows-test.log ]; then
            exit 0
          fi

          awk '/^failures:$/ { section = 1; next } /^test result:/ { section = 0 } section' windows-test.log | sed '/^[[:space:]]*$/d' > failing-tests.txt

          while IFS= read -r name; do
            echo "::error title=Rust test failed on Windows::${name}"
          done < failing-tests.txt

      - name: Build Windows x64 per-user NSIS installer & SHA-256 manifest
        shell: pwsh
        run: ./scripts/windows/build-installer.ps1

      - name: Verify silent NSIS install, WebView2, launch, restart, upgrade & uninstall
        shell: pwsh
        run: ./scripts/windows/smoke-verify.ps1
