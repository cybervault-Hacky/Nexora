# TEMPORARY diagnostic workflow — delete once the Rust gates are green.
#
# The development sandbox cannot read Actions job logs (they are served from a
# host it cannot reach) and job summaries are not exposed by the API, so
# failures found by `ci.yml` are republished as check-run annotations, which are
# readable through api.github.com. This workflow only reads the repository.

name: Diagnostics

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  rust-diagnostics:
    name: Rust diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Report formatting diff
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all
          git diff -- . > "$RUNNER_TEMP/fmt.patch" || true
          python3 - "$RUNNER_TEMP/fmt.patch" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          if text.strip():
              escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=fmt.patch::{escaped}")
          else:
              print("Formatting already clean.")
          PY

      - name: Report cargo check
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          cargo check --all-targets > "$RUNNER_TEMP/check.log" 2>&1
          status=$?
          python3 - "$RUNNER_TEMP/check.log" "$status" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          if sys.argv[2] != "0":
              escaped = text[-60000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=cargo-check::{escaped}")
          else:
              print("cargo check clean.")
          PY

      - name: Report clippy
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          status=$?
          python3 - "$RUNNER_TEMP/clippy.log" "$status" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          if sys.argv[2] != "0":
              escaped = text[-60000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=clippy::{escaped}")
          else:
              print("clippy clean.")
          PY
