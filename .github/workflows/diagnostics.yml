# TEMPORARY diagnostic workflow — delete once the Rust tests pass.
#
# The development sandbox cannot read Actions job logs, so test output is
# republished as chunked check-run annotations, which the API exposes.

name: Diagnostics

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests diagnostics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Report cargo test
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          cargo test > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          python3 - "$RUNNER_TEMP/test.log" "$status" "${{ matrix.os }}" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          print(f"cargo test exit: {sys.argv[2]}")
          tail = text[-60000:]
          size = 3500
          chunks = [tail[i:i + size] for i in range(0, len(tail), size)]

          for index, chunk in enumerate(chunks[-10:], start=1):
              escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=test-{sys.argv[3]}-{index:02d}::{escaped}")
          PY
