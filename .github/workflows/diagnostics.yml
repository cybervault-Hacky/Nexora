# TEMPORARY diagnostic workflow — delete once the Rust gates are green.
#
# The development sandbox cannot read Actions job logs (they are served from a
# host it cannot reach), so failures found by `ci.yml` are reported through the
# job summary instead, which is readable through the API. This workflow runs
# only on manual dispatch and never modifies the repository.

name: Diagnostics

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  rust-diagnostics:
    name: Rust diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the frontend the crate embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Collect formatting diff
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all
          git diff -- . > "$RUNNER_TEMP/fmt.patch" || true
          {
            echo '### cargo fmt diff'
            echo ''
            echo '```diff'
            head -c 400000 "$RUNNER_TEMP/fmt.patch"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect compiler diagnostics
        working-directory: apps/desktop/src-tauri
        run: |
          {
            echo ''
            echo '### cargo check'
            echo ''
            echo '```text'
            cargo check --all-targets 2>&1 | tail -c 200000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect clippy diagnostics
        working-directory: apps/desktop/src-tauri
        run: |
          {
            echo ''
            echo '### cargo clippy'
            echo ''
            echo '```text'
            cargo clippy --all-targets -- -D warnings 2>&1 | tail -c 200000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect test results
        working-directory: apps/desktop/src-tauri
        run: |
          {
            echo ''
            echo '### cargo test'
            echo ''
            echo '```text'
            cargo test 2>&1 | tail -c 200000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
